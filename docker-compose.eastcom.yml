name: centcom

services:
  status-agent:
    extends:
      file: services/caddy/generated/eastcom.compose.yaml
      service: status-agent
    environment:
      STATUS_HOST: eastcom
    volumes:
      - ./scripts/status-agent.py:/app/status-agent.py:ro
      - ./scripts/check-services.py:/app/check-services.py:ro

  pihole:
    extends:
      file: services/caddy/generated/eastcom.compose.yaml
      service: pihole
    environment:
      FTLCONF_webserver_api_password: "${PIHOLE_EASTCOM_PASSWORD:?Set PIHOLE_EASTCOM_PASSWORD}"
      FTLCONF_dns_listeningMode: "ALL"

  beszel-agent:
    extends:
      file: services/beszel/compose.yaml
      service: beszel-agent
    environment:
      LISTEN: "${TAILSCALE_IP_EASTCOM:?Set TAILSCALE_IP_EASTCOM}:45876"
      HUB_URL: ""
      TOKEN: ""

volumes:
  pihole_data:
  pihole_dnsmasq:
  beszel_agent_data:
  beszel_socket:
  status_data:

networks:
  caddy_net:
    external: true
