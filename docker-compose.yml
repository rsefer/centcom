---

x-sure-db-env: &sure_db_env
  POSTGRES_USER: sure_user
  POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD:?Set SURE_POSTGRES_PASSWORD in your .env file}
  POSTGRES_DB: sure_production

x-sure-rails-env: &sure_rails_env
  <<: *sure_db_env
  SECRET_KEY_BASE: ${SURE_SECRET_KEY_BASE:?Set SURE_SECRET_KEY_BASE in your .env file}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  DB_HOST: sure-db
  DB_PORT: 5432
  REDIS_URL: redis://sure-redis:6379/1
  APP_DOMAIN: sure.${DOMAIN}
  ONBOARDING_STATE: ${SURE_ONBOARDING_STATE:-open}

services:

  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    networks:
      - caddy_net
    restart: unless-stopped

  opengym-api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    container_name: opengym-api
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - RP_ID=gym.${DOMAIN}
      - ORIGIN=https://gym.${DOMAIN}
      - RP_NAME=openGym
      - TRUST_PROXY=1
      - FIRST_USER_ADMIN=1
    volumes:
      - opengym_data:/data
    networks:
      - caddy_net
    restart: unless-stopped

  opengym-app:
    image: ghcr.io/duartesantos8/opengym-web:latest
    container_name: opengym-app
    environment:
      - BACKEND=opengym-api
      - PORT=3000
      - NGINX_PORT=80
    depends_on:
      opengym-api:
        condition: service_healthy
    networks:
      - caddy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  opengym-mcp:
    image: centcom/opengym-mcp:local
    build:
      context: ./opengym-mcp
    container_name: opengym-mcp
    profiles:
      - opengym-mcp
    environment:
      - OPENGYM_DATA=/data
      - OPENGYM_UID=${OPENGYM_MCP_UID:-}
      - OPENGYM_URL=https://gym.${DOMAIN}
      - OPENGYM_TOKEN=${OPENGYM_MCP_PAIRING_TOKEN:-}
      - SUPERGATEWAY_API_KEY=${OPENGYM_MCP_ACCESS_TOKEN:-}
    volumes:
      - opengym_data:/data:ro
    depends_on:
      opengym-api:
        condition: service_healthy
    networks:
      - caddy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  sure-web:
    image: ghcr.io/we-promise/sure:${SURE_IMAGE_TAG:-stable}
    container_name: sure-web
    environment:
      <<: *sure_rails_env
    volumes:
      - sure_app_storage:/rails/storage
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    networks:
      - caddy_net
      - sure_net
    restart: unless-stopped

  sure-worker:
    image: ghcr.io/we-promise/sure:${SURE_IMAGE_TAG:-stable}
    container_name: sure-worker
    command: bundle exec sidekiq
    environment:
      <<: *sure_rails_env
    volumes:
      - sure_app_storage:/rails/storage
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    networks:
      - sure_net
    restart: unless-stopped

  sure-db:
    image: postgres:16
    container_name: sure-db
    environment:
      <<: *sure_db_env
    volumes:
      - sure_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net
    restart: unless-stopped

  sure-redis:
    image: redis:latest
    container_name: sure-redis
    volumes:
      - sure_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net
    restart: unless-stopped

  rss:
    image: freshrss/freshrss:latest
    container_name: rss
    environment:
      - TZ=America/Chicago
      - CRON_MIN=*/5
    volumes:
      - ./data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions
    networks:
      - caddy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: centcom/caddy-route53:local
    build:
      context: .
      dockerfile: caddy/Dockerfile
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to the host's Tailscale IPv4 address}:80:80"
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to the host's Tailscale IPv4 address}:443:443"
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to the host's Tailscale IPv4 address}:443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/usr/share/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - ROUTE53_HOSTED_ZONE_ID=${ROUTE53_HOSTED_ZONE_ID}
    networks:
      - caddy_net

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      - TZ=America/Chicago
    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to the host's Tailscale IPv4 address}:53:53/tcp"
      - "${TAILSCALE_IP:?Set TAILSCALE_IP to the host's Tailscale IPv4 address}:53:53/udp"
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    networks:
      - caddy_net
    restart: unless-stopped

  golink:
    image: ghcr.io/tailscale/golink:main
    container_name: golink
    restart: unless-stopped
    user: root
    environment:
      - TS_AUTHKEY=${GO_LINK_TS_AUTHKEY}
    volumes:
      - /opt/golink/data:/home/nonroot
    networks:
      - caddy_net

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    environment:
      - APP_URL=https://beszel.${DOMAIN}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - caddy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 10s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_AGENT_KEY}
      - HUB_URL=http://localhost:8090
      - TOKEN=${BESZEL_AGENT_TOKEN}
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  pihole_data:
  pihole_dnsmasq:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
  opengym_data:
  sure_app_storage:
  sure_postgres_data:
  sure_redis_data:

networks:
  caddy_net:
    external: true
  sure_net:
    driver: bridge
