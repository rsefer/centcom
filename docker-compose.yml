---

services:

  tsidp:
    image: ghcr.io/tailscale/tsidp:latest
    container_name: tsidp
    volumes:
      - tsidp-data:/data
    environment:
      - TAILSCALE_USE_WIP_CODE=1 # tsidp is experimental - needed while version <1.0.0
      - TS_STATE_DIR=/data # store persistent tsnet and tsidp state
      - TS_HOSTNAME=idp # Hostname on tailnet (becomes idp.your-tailnet.ts.net)
      - TSIDP_ENABLE_STS=1 # Enable OAuth token exchange
      - TS_AUTHKEY=${TSIDP_TS_AUTHKEY}
    networks:
      - caddy_net
    restart: unless-stopped

  tsdproxy:
    image: almeidapaulopt/tsdproxy:latest
    container_name: tsdproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tsdproxydata:/data
    environment:
      - TSDPROXY_AUTHKEY=${TSDPROXY_AUTHKEY}
      - TSDPROXY_HOSTNAME=${TSDPROXY_HOSTNAME}
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped

  rss:
    image: freshrss/freshrss:latest
    container_name: rss
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "rss"
    environment:
      - TZ=America/Chicago
      - CRON_MIN=*/5
    ports:
      - 8080:80
    volumes:
      - ./data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions
    networks:
      - caddy_net
    restart: unless-stopped

  caddy:
    image: centcom/caddy-route53:local
    build:
      context: .
      dockerfile: caddy/Dockerfile
    container_name: caddy
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "caddy"
    hostname: caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/usr/share/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - ROUTE53_HOSTED_ZONE_ID=${ROUTE53_HOSTED_ZONE_ID}
    networks:
      - caddy_net

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "pihole"
    environment:
      - TZ=America/Chicago
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80"
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    networks:
      - caddy_net
    restart: unless-stopped

  golink:
    image: ghcr.io/tailscale/golink:main
    container_name: golink
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "go"
    restart: unless-stopped
    user: root
    environment:
      - TS_AUTHKEY=${TSDPROXY_AUTHKEY}
    volumes:
      - /opt/golink/data:/home/nonroot
    networks:
      - caddy_net

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "uptime"
      tsdproxy.port.1: "443/https:3001/http"
    ports:
      - "${TSDPROXY_HOSTNAME}:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - caddy_net
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.33.1
    container_name: ntfy
    command: ["serve"]
    environment:
      - TZ=America/Chicago
      - NTFY_BASE_URL=https://ntfy.${DOMAIN}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_BEHIND_PROXY=true
    volumes:
      - ntfy_data:/var/cache/ntfy
    networks:
      - caddy_net
    restart: unless-stopped

volumes:
  tsidp-data:
  tsdproxydata:
  caddy_data:
  caddy_config:
  pihole_data:
  pihole_dnsmasq:
  uptime-kuma-data:
  ntfy_data:

networks:
  caddy_net:
    external: true
