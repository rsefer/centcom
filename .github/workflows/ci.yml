name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Docker Compose
        run: docker compose version
      - name: Run Python tests
        run: make test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/caddy/www/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: services/caddy/www
      - name: Build dashboard
        run: make dashboard-build
