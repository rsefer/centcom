name: centcom

services:
  caddy:
    extends:
      file: services/caddy/compose.yaml
      service: caddy
    build:
      context: ./services/caddy
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    env_file:
      - services/caddy/generated/northcom.env

  status-agent:
    extends:
      file: services/status/compose.yaml
      service: status-agent
    environment:
      STATUS_HOST: northcom
    volumes:
      - ./scripts/status-agent.py:/app/status-agent.py:ro
      - ./scripts/check-services.py:/app/check-services.py:ro

  pihole:
    extends:
      file: services/pihole/compose.yaml
      service: pihole

  pihole-sync:
    image: ghcr.io/lovelaze/nebula-sync:v0.11.3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PRIMARY: "http://pihole:80|${PIHOLE_NORTHCOM_PASSWORD:?Set PIHOLE_NORTHCOM_PASSWORD}"
      REPLICAS: "http://${TAILSCALE_IP_EASTCOM:?Set TAILSCALE_IP_EASTCOM}:18085|${PIHOLE_EASTCOM_PASSWORD:?Set PIHOLE_EASTCOM_PASSWORD}"
      FULL_SYNC: "false"
      SYNC_CONFIG_DNS: "true"
      SYNC_CONFIG_DNS_EXCLUDE: "interface,listeningMode"
      SYNC_GRAVITY_GROUP: "true"
      SYNC_GRAVITY_AD_LIST: "true"
      SYNC_GRAVITY_AD_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_DOMAIN_LIST: "true"
      SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_CLIENT: "true"
      SYNC_GRAVITY_CLIENT_BY_GROUP: "true"
      RUN_GRAVITY: "true"
      CRON: "0 * * * *"
      TZ: America/Chicago
    networks:
      - caddy_net
    restart: unless-stopped

  beszel-agent:
    extends:
      file: services/beszel/compose.yaml
      service: beszel-agent
    environment:
      LISTEN: "${TAILSCALE_IP_NORTHCOM:?Set TAILSCALE_IP_NORTHCOM}:45876"
      HUB_URL: ""
      TOKEN: ""

volumes:
  caddy_data:
  caddy_config:
  pihole_data:
  pihole_dnsmasq:
  beszel_agent_data:
  beszel_socket:
  status_data:

networks:
  caddy_net:
    external: true
