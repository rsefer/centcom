services:
  golink:
    image: ghcr.io/tailscale/golink:main
    container_name: golink
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: root
    environment:
      - TS_AUTHKEY=${GO_LINK_TS_AUTHKEY}
    volumes:
      - /opt/golink/data:/home/nonroot
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
