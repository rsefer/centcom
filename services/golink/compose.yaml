services:
  golink:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: ghcr.io/tailscale/golink:main
    container_name: golink
    user: root
    environment:
      - TS_AUTHKEY=${GO_LINK_TS_AUTHKEY}
    volumes:
      - /opt/golink/data:/home/nonroot

networks:
  caddy_net:
    external: true
