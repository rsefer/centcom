# Karakeep: bookmark manager. Three containers: the app (web + workers, sqlite
# in karakeep_data), headless Chrome for crawling, and Meilisearch. The search
# index is derived data and is not backed up; rebuild it from the admin panel
# (Admin > Background Jobs > Reindex) after a restore.
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATA_DIR=/data
      - NEXTAUTH_URL=https://keep.${DOMAIN}
      - NEXTAUTH_SECRET=${KARAKEEP_NEXTAUTH_SECRET}
      - MEILI_ADDR=http://karakeep-meili:7700
      - MEILI_MASTER_KEY=${KARAKEEP_MEILI_MASTER_KEY}
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      - DB_WAL_MODE=true
      - DISABLE_SIGNUPS=${KARAKEEP_DISABLE_SIGNUPS:-false}
      - DISABLE_NEW_RELEASE_CHECK=true
      - LOG_LEVEL=warn
      - CRAWLER_BROWSER_TIMEZONE=America/Chicago
    volumes:
      - karakeep_data:/data
    depends_on:
      - karakeep-chrome
      - karakeep-meili
    networks:
      - caddy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: karakeep-chrome
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    mem_limit: 1g
    networks:
      - caddy_net
    restart: unless-stopped

  karakeep-meili:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep-meili
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${KARAKEEP_MEILI_MASTER_KEY}
    volumes:
      - karakeep_meili:/meili_data
    mem_limit: 512m
    networks:
      - caddy_net
    restart: unless-stopped

volumes:
  karakeep_data:
  karakeep_meili:

networks:
  caddy_net:
    external: true
