services:
  caddy:
    image: centcom/caddy-route53:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${TAILSCALE_IP_NORTHCOM:-${TAILSCALE_IP:?Set TAILSCALE_IP or TAILSCALE_IP_NORTHCOM}}:80:80"
      - "${TAILSCALE_IP_NORTHCOM:-${TAILSCALE_IP:?Set TAILSCALE_IP or TAILSCALE_IP_NORTHCOM}}:443:443"
      - "${TAILSCALE_IP_NORTHCOM:-${TAILSCALE_IP:?Set TAILSCALE_IP or TAILSCALE_IP_NORTHCOM}}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - ROUTE53_HOSTED_ZONE_ID=${ROUTE53_HOSTED_ZONE_ID}
      - BESZEL_UPSTREAM=${BESZEL_UPSTREAM:-beszel:8090}
      - DRAW_UPSTREAM=${DRAW_UPSTREAM:-excalidraw:80}
      - GYM_UPSTREAM=${GYM_UPSTREAM:-opengym-app:80}
      - GYM_MCP_UPSTREAM=${GYM_MCP_UPSTREAM:-opengym-mcp:8000}
      - RSS_UPSTREAM=${RSS_UPSTREAM:-rss:80}
      - STATUS_SOUTHCOM_UPSTREAM=${STATUS_SOUTHCOM_UPSTREAM:-status-agent:8080}
      - STATUS_EASTCOM_UPSTREAM=${STATUS_EASTCOM_UPSTREAM:-status-agent:8080}
    networks:
      - caddy_net

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
    external: true
