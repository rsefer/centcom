services:
  vaultwarden:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: vaultwarden/server:1.37.5
    container_name: vaultwarden
    environment:
      DOMAIN: https://vault.${VPN_DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vaultwarden_data:/data

volumes:
  vaultwarden_data:

networks:
  caddy_net:
    external: true
