services:
  status-agent:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: python:3.13-alpine
    command: ["python", "/app/status-agent.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      STATUS_HOST: centcom
      DOMAIN: ${DOMAIN}
    env_file:
      - ../caddy/generated/status.env
    ports:
      - "${TAILSCALE_IP_NORTHCOM:-${TAILSCALE_IP:?Set TAILSCALE_IP or TAILSCALE_IP_NORTHCOM}}:18086:8080"
    volumes:
      - ../../scripts/status-agent.py:/app/status-agent.py:ro
      - ../../scripts/check-services.py:/app/check-services.py:ro
      - ../../scripts/services.py:/app/services.py:ro
      - ../../services.toml:/app/services.toml:ro
      - status_data:/state:ro
      - /var/lib/centcom-selfheal:/selfheal:ro

volumes:
  status_data:

networks:
  caddy_net:
    external: true
