# FreshRSS extensions installed into ./extensions by scripts/install-freshrss-extensions.sh
# (run by scripts/reload.sh on hosts that run FreshRSS).
#
# Format: <git repo URL> <latest | full commit SHA> <extension directory inside the repo, or . for the root>
# "latest" installs the repository's current default-branch commit on every
# reload. Extensions run as PHP inside FreshRSS, so replace "latest" with a
# full commit SHA to pin an extension you don't want to follow upstream.
# Removing a line uninstalls the extension on the next reload (only ones this
# script installed). Newly installed extensions must still be enabled once in the FreshRSS UI;
# the enabled state and rules are stored in data/, which the backup includes.

# Example:
# https://github.com/chenhaoc/freshrss-dedup-extension latest xExtension-TitleDedup
