services:
  opengym-api:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: ghcr.io/duartesantos8/opengym-api:latest
    container_name: opengym-api
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - RP_ID=gym.${DOMAIN}
      - ORIGIN=https://gym.${DOMAIN}
      - RP_NAME=openGym
      - TRUST_PROXY=1
      - FIRST_USER_ADMIN=1
    volumes:
      - opengym_data:/data

  opengym-app:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: ghcr.io/duartesantos8/opengym-web:latest
    container_name: opengym-app
    environment:
      - BACKEND=opengym-api
      - PORT=3000
      - NGINX_PORT=80
    depends_on:
      opengym-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  opengym-mcp:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: centcom/opengym-mcp:local
    build:
      context: ./mcp
    container_name: opengym-mcp
    profiles:
      - opengym-mcp
    environment:
      - OPENGYM_DATA=/data
      - OPENGYM_UID=${OPENGYM_MCP_UID:-}
      - OPENGYM_URL=https://gym.${DOMAIN}
      - OPENGYM_TOKEN=${OPENGYM_MCP_PAIRING_TOKEN:-}
      - SUPERGATEWAY_API_KEY=${OPENGYM_MCP_ACCESS_TOKEN:-}
    volumes:
      - opengym_data:/data:ro
    depends_on:
      opengym-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  opengym_data:

networks:
  caddy_net:
    external: true
