services:
  opengym-api:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: ghcr.io/duartesantos8/opengym-api:latest
    container_name: opengym-api
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - RP_ID=gym.${VPN_DOMAIN}
      - ORIGIN=https://gym.${VPN_DOMAIN}
      - RP_NAME=openGym
      - TRUST_PROXY=1
      - FIRST_USER_ADMIN=1
      - MCP=${MCP:-}
    volumes:
      - opengym_data:/data

  opengym-app:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: ghcr.io/duartesantos8/opengym-web:latest
    container_name: opengym-app
    environment:
      - BACKEND=opengym-api
      - PORT=3000
      - NGINX_PORT=80
      - MCP_BACKEND=opengym-mcp
      - MCP_PORT=3100
    depends_on:
      opengym-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Upstream's optional MCP-over-HTTPS container (docs/MCP_REMOTE.md). Stateless: it holds no
  # data or secrets and talks to opengym-api with each request's scoped token. opengym-app
  # proxies https://gym.${VPN_DOMAIN}/mcp to it. Enable with COMPOSE_PROFILES=mcp and MCP=on.
  opengym-mcp:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: ghcr.io/duartesantos8/opengym-mcp:latest
    container_name: opengym-mcp
    profiles:
      - mcp
    environment:
      - MCP_PORT=3100
      - OPENGYM_API_URL=http://opengym-api:3000
      - ORIGIN=https://gym.${VPN_DOMAIN}
    depends_on:
      opengym-api:
        condition: service_healthy

volumes:
  opengym_data:

networks:
  caddy_net:
    external: true
