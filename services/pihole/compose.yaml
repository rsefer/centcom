services:
  pihole:
    extends:
      file: ../common/compose.yaml
      service: networked-service
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      - TZ=America/Chicago
    ports:
      - "${TAILSCALE_IP_NORTHCOM:-${TAILSCALE_IP:?Set TAILSCALE_IP or TAILSCALE_IP_NORTHCOM}}:53:53/tcp"
      - "${TAILSCALE_IP_NORTHCOM:-${TAILSCALE_IP:?Set TAILSCALE_IP or TAILSCALE_IP_NORTHCOM}}:53:53/udp"
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d

volumes:
  pihole_data:
  pihole_dnsmasq:

networks:
  caddy_net:
    external: true
