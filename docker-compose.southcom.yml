name: centcom

services:
  caddy:
    extends:
      file: services/caddy/compose.yaml
      service: caddy
    build:
      context: ./services/caddy
    ports: !override
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:80:80"
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:443:443"
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:443:443/udp"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    env_file:
      - services/caddy/generated/southcom.env

  status-agent:
    extends:
      file: services/status/compose.yaml
      service: status-agent
    environment:
      STATUS_HOST: southcom
    ports: !override
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:18086:8080"
    volumes:
      - ./scripts/status-agent.py:/app/status-agent.py:ro
      - ./scripts/check-services.py:/app/check-services.py:ro

  beszel:
    extends:
      file: services/beszel/compose.yaml
      service: beszel
    ports:
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:18090:8090"

  beszel-agent:
    extends:
      file: services/beszel/compose.yaml
      service: beszel-agent

  excalidraw:
    extends:
      file: services/excalidraw/compose.yaml
      service: excalidraw
    ports:
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:18081:80"

  golink:
    extends:
      file: services/golink/compose.yaml
      service: golink

  opengym-api:
    extends:
      file: services/opengym/compose.yaml
      service: opengym-api

  opengym-app:
    extends:
      file: services/opengym/compose.yaml
      service: opengym-app
    ports:
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:18082:80"

  opengym-mcp:
    extends:
      file: services/opengym/compose.yaml
      service: opengym-mcp
    build:
      context: ./services/opengym/mcp
    ports:
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:18083:8000"

  karakeep:
    extends:
      file: services/karakeep/compose.yaml
      service: karakeep
    ports:
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:18087:3000"

  karakeep-chrome:
    extends:
      file: services/karakeep/compose.yaml
      service: karakeep-chrome

  karakeep-meili:
    extends:
      file: services/karakeep/compose.yaml
      service: karakeep-meili

  rss:
    extends:
      file: services/freshrss/compose.yaml
      service: rss
    volumes:
      - ./data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions
    ports:
      - "${TAILSCALE_IP_SOUTHCOM:?Set TAILSCALE_IP_SOUTHCOM}:18084:80"

volumes:
  caddy_data:
  caddy_config:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
  opengym_data:
  karakeep_data:
  karakeep_meili:
  status_data:

networks:
  caddy_net:
    external: true
