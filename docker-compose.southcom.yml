name: centcom

services:
  caddy:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: caddy
    build:
      context: ./services/caddy
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    env_file:
      - services/caddy/generated/southcom.env

  status-agent:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: status-agent
    environment:
      STATUS_HOST: southcom
    volumes:
      - ./scripts/status-agent.py:/app/status-agent.py:ro
      - ./scripts/check-services.py:/app/check-services.py:ro

  beszel:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: beszel

  beszel-agent:
    extends:
      file: services/beszel/compose.yaml
      service: beszel-agent

  excalidraw:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: excalidraw

  golink:
    extends:
      file: services/golink/compose.yaml
      service: golink

  opengym-api:
    extends:
      file: services/opengym/compose.yaml
      service: opengym-api

  opengym-app:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: opengym-app

  opengym-mcp:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: opengym-mcp
    build:
      context: ./services/opengym/mcp

  karakeep:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: karakeep

  karakeep-chrome:
    extends:
      file: services/karakeep/compose.yaml
      service: karakeep-chrome

  karakeep-meili:
    extends:
      file: services/karakeep/compose.yaml
      service: karakeep-meili

  vaultwarden:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: vaultwarden

  rss:
    extends:
      file: services/caddy/generated/southcom.compose.yaml
      service: rss
    volumes:
      - ./data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions

volumes:
  caddy_data:
  caddy_config:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
  opengym_data:
  karakeep_data:
  karakeep_meili:
  vaultwarden_data:
  status_data:

networks:
  caddy_net:
    external: true
